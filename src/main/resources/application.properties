spring.application.name=ERP

# Server Configuration
server.port=${PORT:8080}

# MongoDB Atlas connection
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# Logging Configuration
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.com.intern.erp.outbox=DEBUG
logging.level.com.intern.erp.email=DEBUG

# ----------------------------
# SMTP Configuration (Ensure you use a valid App Password for Gmail)
# ----------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=${SPRING_MAIL_FROM:}

# Outbox Processing
outbox.email.poll-interval-ms=5000
outbox.email.max-attempts=3

# Security Configuration


# Management endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Session Cookie Configuration for Cross-Site Support (Vercel -> Render)
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# JWT Configuration
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWFuZC1sb25nLXNlY3JldC1rZXktZm9yLWp3dC1nZW5lcmF0aW9u}
jwt.expiration-ms=3600000

