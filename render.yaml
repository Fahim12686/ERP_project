services:
  # Backend Web Service (Spring Boot)
  - type: web
    name: erp-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATA_MONGODB_URI
        sync: false # Set this in Render dashboard
      - key: FRONTEND_URL
        sync: false # Set to your frontend Render URL, e.g., https://erp-frontend.onrender.com
      - key: JWT_SECRET
        sync: false # Set a long random secret
      - key: DEMO_ADMIN_PASSWORD
        sync: false # Set a strong password

  # Frontend Static Site (React + Vite)
  - type: web
    name: erp-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    publishDir: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your backend Render URL, e.g., https://erp-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
